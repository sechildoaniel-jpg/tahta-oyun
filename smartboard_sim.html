<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Benim Okulum · Müdür Simülasyonu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0c10;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;color:#fff}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:relative;width:min(100vw,560px);height:100vh;height:100dvh;max-height:1000px;overflow:hidden;background:#12151c}
@media(min-width:640px){#stage{border-radius:16px;border:4px solid #1a1e28;box-shadow:0 20px 60px #000;height:min(1000px,94dvh)}}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
#toast{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:#000e;padding:8px 14px;border-radius:12px;font-size:11px;z-index:600;opacity:0;transition:.25s;pointer-events:none;max-width:92%;text-align:center}
#toast.on{opacity:1}
#top{position:absolute;top:0;left:0;right:0;z-index:50;padding:6px 8px;display:flex;gap:6px;align-items:center}
#top button{padding:5px 9px;background:rgba(0,0,0,.5);border-radius:9px;font-size:10px;border:1px solid rgba(255,255,255,.1)}
#top .t{flex:1;text-align:center;font-size:11px;opacity:.7}

/* EV */
#home{background:linear-gradient(180deg,#2a3548,#1a2030 55%,#3a3228 55%)}
#home .box{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;width:85%}
#home h1{font-size:17px;margin-bottom:6px}
#home p{font-size:11px;opacity:.5;margin-bottom:16px}
.btn-p{padding:12px 22px;background:#3e91ff;border-radius:14px;font-weight:600;font-size:13px;display:inline-block}

/* ARABA */
#car{background:linear-gradient(180deg,#1a2535,#0d1218)}
#car-dash{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:88%;max-width:300px;background:#1e2430;border-radius:16px;padding:16px;border:1px solid #333}
#car-dash h2{font-size:13px;margin-bottom:8px;text-align:center}
#pin-d{text-align:center;font-size:22px;letter-spacing:8px;margin:10px 0;min-height:32px;font-family:monospace}
#pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:180px;margin:0 auto}
#pin-pad button{height:40px;border-radius:10px;background:#2a3140;font-size:16px}
#pin-pad button:active{background:#3e91ff}
#drive{display:none;text-align:center;padding:20px}
#drive.on{display:block}
#road{height:80px;background:linear-gradient(180deg,#3a3a42,#2a2a32);margin:12px 0;position:relative;overflow:hidden;border-radius:8px}
#car-icon{position:absolute;left:10%;bottom:20px;font-size:28px;transition:left 4s linear}
#car-icon.go{left:75%}

/* OKUL ÖNÜ — anneler */
#gate{background:linear-gradient(180deg,#7ec8f0 0%,#c5e5f7 35%,#4a7a4a 35%,#3a6a3a 100%)}
#gate .panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;text-align:center}
.moms{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.mom{width:36px;text-align:center;font-size:8px}
.mom .h{width:14px;height:14px;border-radius:50%;background:#e8bc98;margin:0 auto;position:relative}
.mom .h::before{content:"";position:absolute;top:-4px;left:0;right:0;height:8px;border-radius:8px 8px 0 0;background:#3a2a1a}
.mom .b{width:18px;height:22px;border-radius:4px 4px 0 0;margin:2px auto 0;background:#c45c7a}
#gate .school{width:120px;height:70px;background:#e8e0d0;border:3px solid #8b7355;margin:10px auto;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#333}

/* KORİDOR — tüm sınıflar açık (müdür) */
#hall{background:linear-gradient(180deg,#3d4555 0%,#2a303c 42%,#4a4035 42%)}
#hall-sc{position:absolute;inset:0;overflow-x:auto;display:flex;align-items:center;gap:14px;padding:60px 24px 60px;scroll-snap-type:x mandatory;scrollbar-width:none}
#hall-sc::-webkit-scrollbar{display:none}
.rd{flex:none;width:100px;scroll-snap-align:center;text-align:center;cursor:pointer}
.rd .door{height:140px;width:56px;margin:0 auto;background:linear-gradient(90deg,#6b4423,#4a2f18);border:2px solid #3d2814;border-radius:4px 4px 0 0;position:relative}
.rd.mine .door{border-color:#c9a227;box-shadow:0 0 14px #c9a22744}
.rd .door::after{content:"";position:absolute;right:6px;top:42%;width:4px;height:4px;border-radius:50%;background:#ddd}
.rd b{display:block;margin-top:6px;font-size:10px}
.rd small{font-size:8px;opacity:.45}

/* SINIF */
#classroom{overflow:hidden;background:#1a2030}
.sky{position:absolute;top:0;left:0;right:0;height:22%;background:linear-gradient(180deg,#6eb8e8,#d4eaf7)}
.sun{position:absolute;right:8%;top:6%;width:28px;height:28px;border-radius:50%;background:#ffe566;box-shadow:0 0 24px #fc08}
.wall{position:absolute;left:0;right:0;top:22%;bottom:12%;background:#f0ebe3}
.floor{position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(180deg,#d2b48c,#b8956a);border-top:2px solid #9a7b52}

/* === Videodaki gibi IFP: model, orta güç, 2 kalem === */
#bw-wrap{position:absolute;left:1%;top:22%;width:80%;height:38%;z-index:6}
#bw{position:relative;width:100%;height:100%;background:#0c0c0e;border-radius:4px;
  box-shadow:0 0 0 10px #1c1c20,0 0 0 11px #0a0a0c,0 16px 40px #0009;
  overflow:hidden;transition:transform .3s}
#bw.empty{background:#c5c0b8;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#666;box-shadow:0 0 0 10px #8a8580,0 0 0 11px #6a6560,0 8px 24px #0005}
#bw.exp{transform:scale(1.02);z-index:20}
#bw-bezel-top{position:absolute;top:0;left:0;right:0;height:18px;background:#1c1c20;z-index:5;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:8px;color:#666;letter-spacing:.5px}
#bw-bezel-top .brand{color:#888;font-weight:600}
#bw-bezel-top .model{color:#555}
#bw-screen{position:absolute;top:18px;left:4px;right:4px;bottom:28px;background:#000;overflow:hidden}
#bw.empty #bw-screen{display:none}
#bw-clock{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:13px;font-weight:300;
  letter-spacing:2px;color:#fff;z-index:3;text-shadow:0 1px 4px #000;display:none}
#bw:not(.empty) #bw-clock{display:block}
#bw-body{position:absolute;inset:0;display:none}
#bw:not(.empty) #bw-body{display:block}
/* Alt çerçeve + ORTA güç tuşu */
#bw-bezel-bot{position:absolute;bottom:0;left:0;right:0;height:28px;background:#1c1c20;z-index:8;
  display:flex;align-items:center;justify-content:center}
#pwr{position:relative;width:34px;height:14px;border-radius:7px;background:#2a2a30;
  border:2px solid #4a4a52;cursor:pointer;box-shadow:inset 0 1px 2px #0008;display:none}
#bw:not(.empty) #pwr{display:block}
#pwr.lit{background:#1a5cff;border-color:#4a8aff;box-shadow:0 0 14px #1a5cff99,inset 0 0 4px #fff3}
#pwr .led{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;
  border-radius:50%;background:#555;border:1px solid #777}
#pwr.lit .led{background:#fff;border-color:#cce;box-shadow:0 0 6px #fff}
/* 2 kalem — sağ çerçeve */
#pens{position:absolute;right:-2px;top:40%;transform:translateY(-50%);display:none;flex-direction:column;gap:6px;z-index:12}
#bw:not(.empty) #pens{display:flex}
.pen{width:12px;height:42px;border-radius:2px;background:linear-gradient(180deg,#f0f0f4 0%,#b0b0b8 40%,#707078 100%);
  border:1px solid #555;cursor:pointer;box-shadow:-2px 2px 6px #0005;position:relative}
.pen::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:4px;height:8px;
  background:#333;border-radius:0 0 1px 1px}
.pen:active,.pen.out{transform:translateX(-22px)}
#bw-modes{position:absolute;bottom:30px;left:0;right:0;height:18px;background:rgba(12,12,16,.9);
  display:none;justify-content:center;gap:3px;align-items:center;z-index:10}
#bw:not(.empty) #bw-modes{display:flex}
#bw-modes button{padding:1px 6px;border-radius:3px;font-size:7px;background:#2a2a35;border:1px solid #3a3a45;color:#ccc}
#bw-modes button.on{background:#1a5cff;border-color:#1a5cff;color:#fff}

#scr-pc{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(135deg,#0078d4 0%,#005a9e 40%,#003d6b 100%)}
#scr-pc.on{display:flex}
#scr-pc::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 70% 20%,rgba(255,255,255,.15),transparent 50%);pointer-events:none}
#scr-pc .icons{flex:1;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;position:relative;z-index:1}
#scr-pc .ic{width:36px;text-align:center;font-size:7px;cursor:pointer;text-shadow:0 1px 2px #0008}
#scr-pc .ic i{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 1px;border-radius:4px;background:rgba(255,255,255,.15);font-style:normal;font-size:11px}
#scr-pc .tb{height:20px;background:rgba(32,32,32,.85);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;gap:3px;position:relative;z-index:1}
#scr-pc .tb span{font-size:9px;padding:1px 4px;cursor:pointer;border-radius:3px}

#scr-tab{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 30%,#1a3a5c,#0a1218);padding:6px}
#scr-tab.on{display:block}
#scr-tab .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#scr-tab .ta{text-align:center;font-size:7px;cursor:pointer}
#scr-tab .ta i{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 1px;border-radius:6px;font-style:normal;font-size:11px}

#scr-ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0a0a0c}
#scr-ph.on{display:flex}
#scr-ph .fr{width:36%;aspect-ratio:9/16;background:radial-gradient(ellipse at 50% 40%,#4a2d7a,#1a1230);border-radius:10px;border:1px solid #333;padding:4px;font-size:7px;text-align:center}
#scr-ph .fr .c{font-size:16px;margin:8px 0}


#scr-home{position:absolute;inset:0;display:none;background:linear-gradient(160deg,#1a2332,#0d1218);padding:10px;overflow:auto}
#scr-home.on{display:block}
.home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hg{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 4px;text-align:center;font-size:8px;cursor:pointer;border:1px solid rgba(255,255,255,.1)}
.hg i{display:block;font-style:normal;font-size:18px;margin-bottom:4px}
.hg:active{background:#1a5cff44}
#scr-vis{position:absolute;inset:0;display:none;background:#0a0e14;flex-direction:column;padding:6px}
#scr-vis.on{display:flex}
#scr-wb{position:absolute;inset:0;display:none;background:#f7f7f2;cursor:crosshair}
#scr-wb.on{display:block}
#scr-wb canvas{width:100%;height:100%;display:block}
#scr-wb .wtools{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#333;padding:4px 6px;border-radius:10px;z-index:5}
#scr-wb .wtools button{width:20px;height:20px;border-radius:50%;font-size:9px;border:1px solid #555}
#scr-yt{position:absolute;inset:0;display:none;background:#0f0f0f;padding:4px;overflow:auto}
#scr-yt.on{display:block}
#scr-yt .v{background:#212121;border-radius:6px;padding:6px;margin-bottom:4px;font-size:8px;cursor:pointer}
#scr-yt .v:active{background:#333}

/* Kablo / sınıf PC */
#desk-pc{position:absolute;right:3%;bottom:14%;width:18%;height:12%;background:#2a2a32;border-radius:4px;border:1px solid #444;z-index:5;display:flex;align-items:center;justify-content:center;font-size:8px;color:#888;cursor:pointer}
#desk-pc.on{border-color:#3e91ff;color:#3e91ff}
#cable{position:absolute;right:12%;bottom:20%;width:0;height:3px;background:linear-gradient(90deg,#333,#888);z-index:7;transition:width .8s;transform-origin:right;border-radius:2px}
#cable.plug{width:12%}

/* Öğrenciler */
#rows{position:absolute;left:2%;width:68%;bottom:12%;z-index:4}
.row{display:flex;flex-wrap:wrap;gap:1px 2px;margin-bottom:1px}
.row.dim{opacity:.55;transform:scale(.9);transform-origin:left bottom}
.kid{width:24px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center}
.kid .hair{width:14px;height:6px;border-radius:7px 7px 0 0;margin-bottom:-2px}
.kid .face{width:12px;height:12px;border-radius:50%;background:#e8bc98;position:relative}
.kid .face::before,.kid .face::after{content:"";position:absolute;width:2px;height:2px;border-radius:50%;background:#222;top:4px}
.kid .face::before{left:2px}.kid .face::after{right:2px}
.kid .body{width:14px;height:14px;border-radius:3px 3px 0 0;margin-top:1px}
.kid.hand::after{content:"✋";position:absolute;top:-12px;right:-2px;font-size:9px}
.kid.scared .face{background:#d4a080}
.kid.speak .bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-size:7px;padding:2px 4px;border-radius:5px;white-space:nowrap;z-index:12;box-shadow:0 1px 4px #0003}

/* Öğretmen masası */
#tdesk{position:absolute;right:2%;top:52%;width:26%;background:#8b6914;border-radius:3px;padding:4px;z-index:5;font-size:7px;color:#fff}
#tdesk .papers{display:flex;flex-direction:column;gap:2px;margin-top:3px}
#tdesk .paper{background:#f5f0e6;color:#333;padding:3px 4px;border-radius:2px;cursor:pointer;font-size:7px}
#tdesk .paper:active{background:#3e91ff;color:#fff}
#tdesk .food{margin-top:3px;opacity:.8}

#helpers{position:absolute;left:40%;bottom:14%;display:none;gap:8px;z-index:9}
#helpers.on{display:flex}
.hp{text-align:center;font-size:7px;color:#333}
.hp .f{width:12px;height:12px;border-radius:50%;background:#d4a574;margin:0 auto}
.hp .b{width:14px;height:18px;border-radius:3px 3px 0 0;margin:1px auto 0;background:#4a90d9}

#bar{position:absolute;bottom:1px;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;z-index:30;padding:0 3px}
.b{padding:5px 8px;border-radius:9px;background:rgba(0,0,0,.55);font-size:9px;border:1px solid rgba(255,255,255,.1)}
.b:disabled{opacity:.3}
#bag{position:absolute;bottom:28px;right:8px;width:36px;height:28px;background:#3a2a1a;border-radius:4px 4px 2px 2px;z-index:25;cursor:pointer;border:1px solid #2a1a10;display:flex;align-items:flex-end;justify-content:center;font-size:8px;padding-bottom:2px}
#bag.open{background:#5a4030;height:34px}
#bag .card{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:22px;height:14px;background:#1a1a22;border-radius:2px;border:1px solid #444;font-size:6px;display:none;align-items:center;justify-content:center}
#bag.open .card{display:flex}

/* PIN PC overlay */
#pc-lock{position:absolute;inset:0;z-index:100;display:none;background:rgba(0,20,40,.95);align-items:center;justify-content:center;flex-direction:column}
#pc-lock.on{display:flex}
#pc-lock h3{font-size:12px;margin-bottom:8px}
#pc-pin{font-size:20px;letter-spacing:6px;margin:8px 0;font-family:monospace;min-height:28px}
#pc-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:140px}
#pc-pad button{height:36px;border-radius:8px;background:#1a3040;font-size:14px}

#zoom{position:absolute;inset:0;z-index:90;display:none;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
#zoom.on{display:flex}
#zoom .card{background:#1e1e28;border-radius:14px;padding:14px;text-align:center;width:70%;border:1px solid #333}
#zoom .fh{width:56px;height:22px;border-radius:28px 28px 0 0;margin:0 auto -8px}
#zoom .ff{width:48px;height:48px;border-radius:50%;background:#e8bc98;margin:0 auto 6px;position:relative}
#zoom .ff::before,#zoom .ff::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#222;top:18px}
#zoom .ff::before{left:12px}#zoom .ff::after{right:12px}
</style>
</head>
<body>
<div id="stage">
<div id="toast"></div>
<div id="top">
  <button type="button" id="btn-back" style="visibility:hidden" onclick="goBack()">←</button>
  <div class="t" id="title">Ev</div>
  <button type="button" onclick="yell()">BAĞIR</button>
</div>

<div id="home" class="scene on">
  <div class="box">
    <h1>Ev</h1>
    <p>Sabah · Okula gitme zamanı</p>
    <button type="button" class="btn-p" onclick="goCar()">Arabaya bin</button>
  </div>
</div>

<div id="car" class="scene">
  <div id="car-dash">
    <h2>Araç · PIN</h2>
    <div id="pin-d">____</div>
    <div id="pin-pad">
      <button type="button" onclick="pin(1)">1</button><button type="button" onclick="pin(2)">2</button><button type="button" onclick="pin(3)">3</button>
      <button type="button" onclick="pin(4)">4</button><button type="button" onclick="pin(5)">5</button><button type="button" onclick="pin(6)">6</button>
      <button type="button" onclick="pin(7)">7</button><button type="button" onclick="pin(8)">8</button><button type="button" onclick="pin(9)">9</button>
      <button type="button" onclick="pinClr()">C</button><button type="button" onclick="pin(0)">0</button><button type="button" onclick="pinOk()">OK</button>
    </div>
    <p style="font-size:9px;opacity:.4;text-align:center;margin-top:8px">PIN: 1212</p>
  </div>
  <div id="drive">
    <p style="font-size:12px;margin-bottom:8px">Okula sürülüyor…</p>
    <div id="road"><div id="car-icon">🚗</div></div>
  </div>
</div>

<div id="gate" class="scene">
  <div class="panel">
    <div class="school">Okul girişi</div>
    <p style="font-size:11px;opacity:.7;margin-bottom:6px">Anneler çocukları bırakıyor</p>
    <div class="moms" id="moms"></div>
    <button type="button" class="btn-p" onclick="goHall()" style="margin-top:10px">Okula gir · Müdür</button>
  </div>
</div>

<div id="hall" class="scene">
  <div id="hall-sc"></div>
</div>

<div id="classroom" class="scene">
  <div class="sky"><div class="sun"></div></div>
  <div class="wall"></div>
  <div class="floor"></div>

  <div id="bw-wrap">
    <div id="bw" class="empty">Tahta yeri boş</div>
  </div>

  <div id="desk-pc" onclick="plugCable()">PC</div>
  <div id="cable"></div>

  <div id="tdesk">
    <div>Müdür masası</div>
    <div class="food">☕ Yemek</div>
    <div class="papers">
      <div class="paper" onclick="givePaper(1)">📄 1. sınıf matematik</div>
      <div class="paper" onclick="givePaper(2)">📄 2. sınıf matematik</div>
      <div class="paper" onclick="givePaper(3)">📄 3. sınıf matematik</div>
    </div>
  </div>

  <div id="rows"></div>
  <div id="helpers">
    <div class="hp"><div class="f"></div><div class="b"></div>Ali</div>
    <div class="hp"><div class="f"></div><div class="b" style="background:#e85d75"></div>Ayşe</div>
  </div>

  <div id="bag" onclick="toggleBag()"><span class="card" onclick="event.stopPropagation();powerBoard()">KART</span>🎒</div>

  <div id="bar">
    <button class="b" type="button" onclick="installBoard()">2 çocuk taksın</button>
    <button class="b" type="button" id="btn-open" onclick="powerBoard()" disabled>Tahtayı aç</button>
    <button class="b" type="button" onclick="raiseHands()">El kaldırsın</button>
    <button class="b" type="button" onclick="confiscate()">Telefon al</button>
    <button class="b" type="button" onclick="sendOut()">Dışarı</button>
  </div>
</div>

<div id="pc-lock">
  <h3>Windows 11 · PIN</h3>
  <div id="pc-pin">____</div>
  <div id="pc-pad">
    <button type="button" onclick="pcPin(1)">1</button><button type="button" onclick="pcPin(2)">2</button><button type="button" onclick="pcPin(3)">3</button>
    <button type="button" onclick="pcPin(4)">4</button><button type="button" onclick="pcPin(5)">5</button><button type="button" onclick="pcPin(6)">6</button>
    <button type="button" onclick="pcPin(7)">7</button><button type="button" onclick="pcPin(8)">8</button><button type="button" onclick="pcPin(9)">9</button>
    <button type="button" onclick="pcPinClr()">C</button><button type="button" onclick="pcPin(0)">0</button><button type="button" onclick="pcPinOk()">OK</button>
  </div>
  <p style="font-size:9px;opacity:.4;margin-top:8px">1212</p>
</div>

<div id="zoom">
  <div class="card">
    <div class="fh" id="zh"></div>
    <div class="ff"></div>
    <b id="zn">Ad</b>
    <p id="zl" style="font-size:11px;opacity:.7;margin:6px 0"></p>
    <button type="button" class="btn-p" style="padding:8px 12px;font-size:11px" onclick="closeZoom()">Kapat</button>
  </div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const NAMES=['Elif','Can','Zeynep','Mert','Ayşe','Burak','Deniz','Ece','Emre','Fatma','Gökhan','Hira','İpek','Kaan','Leyla','Mehmet','Naz','Ozan','Pınar','Rüzgar','Selin','Tolga','Umut','Yağmur','Ada','Berk','Ceren','Doruk','Ela','Furkan'];
const HAIRS=['#1a1a1a','#3a2a1a','#5c4030','#2a1a10','#4a3020','#6b4423','#1a1520','#8b6914'];
const SHIRTS=['#3e91ff','#34c759','#ff9500','#af52de','#ff2d55','#00c7be','#5ac8fa','#ffcc00','#ff6b6b','#4ecdc4'];
let St={pin:'',pcpin:'',installed:false,boardOn:false,mode:'pc',scared:false,bagOpen:false,stack:['home']};
let kids=[];

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),1600)}
function speak(text,rate){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='tr-TR';u.rate=rate||1;u.pitch=rate&&rate<1?0.7:1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function show(id){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  const titles={home:'Ev',car:'Araba',gate:'Okul önü',hall:'Koridor · Müdür',classroom:'Sınıf'};
  $('#title').textContent=titles[id.slice(1)]||'';
  $('#btn-back').style.visibility=id==='#home'?'hidden':'visible';
  St.stack.push(id);
}
function goBack(){
  if($('#classroom').classList.contains('on')){show('#hall');return}
  if($('#hall').classList.contains('on')){show('#gate');return}
  if($('#gate').classList.contains('on')){show('#car');return}
  if($('#car').classList.contains('on')){show('#home');return}
  show('#home');
}

function goCar(){show('#car');St.pin='';$('#pin-d').textContent='____';$('#car-dash').style.display='block';$('#drive').classList.remove('on')}
function pin(n){if(St.pin.length>=4)return;St.pin+=''+n;$('#pin-d').textContent=St.pin.replace(/./g,'•').padEnd(4,'_')}
function pinClr(){St.pin='';$('#pin-d').textContent='____'}
function pinOk(){
  if(St.pin==='1212'){
    toast('Araç açıldı');
    $('#car-dash').style.display='none';
    $('#drive').classList.add('on');
    $('#car-icon').classList.remove('go');
    void $('#car-icon').offsetWidth;
    $('#car-icon').classList.add('go');
    setTimeout(()=>{show('#gate');buildMoms();toast('Okul önü · Anneler')},4200);
  }else{toast('Yanlış PIN');pinClr()}
}

function buildMoms(){
  $('#moms').innerHTML=[0,1,2,3,4].map(i=>`<div class="mom"><div class="h"></div><div class="b" style="background:${SHIRTS[i+2]}"></div>Anne</div>`).join('');
}

function goHall(){
  show('#hall');
  const rooms=[['Müdür','201'],['9-A','202'],['9-B','203'],['Benim sınıfım','204'],['Lab · Android','205'],['10-A','206'],['10-B · Android','207'],['Kütüphane','208'],['Öğrt. odası','209']];
  $('#hall-sc').innerHTML=rooms.map((r,i)=>`
    <div class="rd${i===3?' mine':''}" onclick="${i===0?"toast('Müdür odası · Sen buradasın')":i===3?"goClass()":`enterOther('${r[0]}')`}">
      <div class="door"></div><b>${r[0]}</b><small>${r[1]}</small>
    </div>`).join('');
  toast('Müdür · Tüm sınıflara girebilirsin');
}
function enterOther(name){
  toast(name+' · Girdin (müdür)');
  // Diğer sınıflarda da tahta var; özel oda Android
  const isAndroid = name.includes('Lab') || name.includes('10-B');
  setTimeout(()=>{
    if(isAndroid){
      toast(name+' · Özel Android tahta (yalnızca Android)');
      speak('Android tahta hazır');
    }else{
      toast(name+' · Akıllı tahta takılı · NearHub');
    }
  },800);
}
function goClass(){show('#classroom');buildKids();toast('Benim sınıfım');setTimeout(()=>greet(),500)}

function buildKids(){
  kids=[];
  const counts=[11,10,9];
  let id=0;
  $('#rows').innerHTML=counts.map((c,ri)=>{
    let h='';
    for(let i=0;i<c;i++){
      const k={id:id,name:NAMES[id%NAMES.length],hair:HAIRS[id%HAIRS.length],shirt:SHIRTS[id%SHIRTS.length]};
      kids.push(k);
      h+=`<div class="kid" data-id="${id}" onclick="focusKid(${id})">
        <div class="hair" style="background:${k.hair}"></div>
        <div class="face"></div>
        <div class="body" style="background:${k.shirt}"></div>
      </div>`;
      id++;
    }
    return `<div class="row${ri>0?' dim':''}">${h}</div>`;
  }).join('');
}

function installBoard(){
  if(St.installed){toast('Takılı');return}
  $('#helpers').classList.add('on');
  toast('Ali ve Ayşe tahtayı takıyor…');
  setTimeout(()=>{
    St.installed=true;
    const bw=$('#bw');
    bw.classList.remove('empty');
    bw.textContent='';
    bw.innerHTML=
      '<div id="bw-bezel-top"><span class="brand">Prowise</span><span class="model">Touchscreen 86"</span></div>'+
      '<div id="bw-screen">'+
        '<div id="bw-clock">--:--</div>'+
        '<div id="bw-body">'+
          '<div id="scr-pc" class="on">'+
            '<div class="icons">'+
              '<div class="ic" onclick="toast(\'Bu Bilgisayar\')"><i>💻</i>PC</div>'+
              '<div class="ic" onclick="toast(\'Dosyalar\')"><i>📁</i>Dosya</div>'+
              '<div class="ic" onclick="openYT()"><i>▶</i>YouTube</div>'+
              '<div class="ic" onclick="toast(\'Edge\')"><i>🌐</i>Edge</div>'+
              '<div class="ic" onclick="toast(\'Whiteboard\')"><i>📝</i>Yazı</div>'+
              '<div class="ic" onclick="toast(\'S26 Ultra\')"><i>📲</i>S26U</div>'+
            '</div>'+
            '<div class="tb"><span onclick="setMode(\'pc\')">PC</span><span onclick="setMode(\'tab\')">Tablet</span><span onclick="setMode(\'ph\')">Tel</span><span onclick="openYT()">YT</span></div>'+
          '</div>'+
          '<div id="scr-tab">'+
            '<div class="apps">'+
              '<div class="ta" onclick="toast(\'Chrome\')"><i style="background:#4285f4">🌐</i>Chrome</div>'+
              '<div class="ta" onclick="openYT()"><i style="background:#f00">▶</i>YT</div>'+
              '<div class="ta" onclick="toast(\'Sınıf\')"><i style="background:#3a3">📚</i>Sınıf</div>'+
              '<div class="ta" onclick="setMode(\'pc\')"><i style="background:#666">💻</i>PC</div>'+
            '</div>'+
          '</div>'+
          '<div id="scr-ph"><div class="fr"><div class="c" id="phc">12:00</div><div>Galaxy</div></div></div>'+
          '<div id="scr-yt">'+
            '<div class="v" onclick="speak(\'Matematik dersi\')">▶ Matematik 3. sınıf</div>'+
            '<div class="v" onclick="speak(\'Fen deneyi\')">▶ Fen deneyi</div>'+
            '<div class="v" onclick="speak(\'Okul şarkısı\')">▶ Okul şarkıları</div>'+
            '<div class="v" onclick="setMode(\'pc\')">← Masaüstü</div>'+
          '</div>'+
          '<div id="scr-wb">'+
            '<canvas id="wcv"></canvas>'+
            '<div class="wtools">'+
              '<button type="button" style="background:#111" onclick="setWc(\'#111\')" title="Siyah"></button>'+
              '<button type="button" style="background:#c62828" onclick="setWc(\'#c62828\')"></button>'+
              '<button type="button" style="background:#1565c0" onclick="setWc(\'#1565c0\')"></button>'+
              '<button type="button" style="background:#2e7d32" onclick="setWc(\'#2e7d32\')"></button>'+
              '<button type="button" style="background:#f9a825" onclick="setWc(\'#f9a825\')"></button>'+
              '<button type="button" onclick="wClear()">🗑️</button>'+
              '<button type="button" onclick="wbBg(0)">⬜</button>'+
              '<button type="button" onclick="wbBg(1)">☰</button>'+
              '<button type="button" onclick="wbBg(2)">▦</button>'+
              '<button type="button" onclick="wbTimer()">⏱</button>'+
              '<button type="button" onclick="setMode(\'home\')">⌂</button>'+
            '</div>'+
            '<div id="wb-timer" style="display:none;position:absolute;top:8px;right:8px;background:#000c;color:#fff;padding:6px 10px;border-radius:8px;font-size:16px">2:00</div>'+
          '</div>'+
          '<div id="scr-home">'+
            '<div class="home-grid">'+
              '<div class="hg" onclick="setMode(\'wb\')"><i>📝</i>Whiteboard</div>'+
              '<div class="hg" onclick="setMode(\'pc\')"><i>💻</i>PC / HDMI</div>'+
              '<div class="hg" onclick="setMode(\'vis\')"><i>📷</i>Visualizer</div>'+
              '<div class="hg" onclick="openYT()"><i>▶</i>YouTube</div>'+
              '<div class="hg" onclick="setMode(\'tab\')"><i>📱</i>Android</div>'+
              '<div class="hg" onclick="toast(\'AirPlay / Chromecast\')"><i>📡</i>Yayın</div>'+
              '<div class="hg" onclick="toast(\'Dosyalar / USB\')"><i>📁</i>Dosya</div>'+
              '<div class="hg" onclick="toast(\'Ayarlar\')"><i>⚙️</i>Ayarlar</div>'+
            '</div>'+
          '</div>'+
          '<div id="scr-vis">'+
            '<div style="padding:12px;text-align:center;font-size:11px;opacity:.8">PC Visualizer<br><small>HDMI / USB ile bilgisayar görüntüsü</small></div>'+
            '<div style="margin:8px;height:60%;background:linear-gradient(160deg,#1a2a3a,#0a1520);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#6af">HDMI sinyali bekleniyor…</div>'+
            '<div style="text-align:center"><button type="button" style="padding:6px 12px;background:#1a5cff;border-radius:8px;font-size:10px" onclick="setMode(\'wb\')">Kalem ile üzerine yaz</button></div>'+
          '</div>'+
        '</div>'+
        '<div id="bw-modes">'+
          '<button type="button" class="on" data-m="pc" onclick="setMode(\'pc\')">PC</button>'+
          '<button type="button" data-m="tab" onclick="setMode(\'tab\')">Tablet</button>'+
          '<button type="button" data-m="ph" onclick="setMode(\'ph\')">Telefon</button>'+
          '<button type="button" data-m="yt" onclick="openYT()">YouTube</button>'+
          '<button type="button" data-m="wb" onclick="setMode(\'wb\')">Tahta</button>'+
          '<button type="button" data-m="home" onclick="setMode(\'home\')">Menü</button>'+
        '</div>'+
      '</div>'+
      '<div id="bw-bezel-bot"><button type="button" id="pwr" onclick="powerBoard()"><span class="led"></span></button></div>'+
      '<div id="pens">'+
        '<div class="pen" onclick="this.classList.toggle(\'out\');toast(\'Kalem 1\')"></div>'+
        '<div class="pen" onclick="this.classList.toggle(\'out\');toast(\'Kalem 2\')"></div>'+
      '</div>';
    const btn=$('#btn-open');
    if(btn)btn.disabled=false;
    $('#helpers').classList.remove('on');
    tickClock();
    toast('Prowise Touchscreen 86" takıldı · Orta güç tuşu');
  },1600);
}

function powerBoard(){
  if(!St.installed){toast('Önce tahtayı tak');return}
  St.boardOn=!St.boardOn;
  $('#bw').classList.toggle('exp',St.boardOn);
  $('#pwr').classList.toggle('lit',St.boardOn);
  if(St.boardOn){setMode('home');toast('Prowise açık · Ana menü')}
  else toast('Tahta kapalı');
}
function setMode(m){
  St.mode=m;
  ['#scr-pc','#scr-tab','#scr-ph','#scr-yt','#scr-wb','#scr-home','#scr-vis'].forEach(id=>{const e=$(id);if(e)e.classList.remove('on')});
  if(m==='pc'){$('#scr-pc').classList.add('on');toast('PC / HDMI')}
  if(m==='tab'){$('#scr-tab').classList.add('on');toast('Android')}
  if(m==='ph'){$('#scr-ph').classList.add('on');toast('Telefon')}
  if(m==='yt'){$('#scr-yt').classList.add('on');toast('YouTube')}
  if(m==='home'){$('#scr-home').classList.add('on');toast('Prowise ana menü')}
  if(m==='vis'){$('#scr-vis').classList.add('on');toast('PC Visualizer · HDMI')}
  if(m==='wb'){
    $('#scr-wb').classList.add('on');
    const cv=$('#wcv');
    if(cv){
      const r=cv.parentElement.getBoundingClientRect();
      cv.width=Math.max(100,r.width);cv.height=Math.max(80,r.height);
      if(!window._wctx){window._wctx=cv.getContext('2d');window._wctx.lineCap='round';window._wctx.lineWidth=3}
      wbBg(St.wbBg||0);
    }
    toast('Whiteboard · Kalem ile yaz');
  }
  document.querySelectorAll('#bw-modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m||(m==='vis'&&b.dataset.m==='pc')));
  $('#bw').classList.add('exp');
  St.boardOn=true;const pw=$('#pwr');if(pw)pw.classList.add('lit');
}
function wbBg(n){
  St.wbBg=n;
  const cv=$('#wcv');if(!cv||!window._wctx)return;
  const ctx=window._wctx,w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#f7f7f2';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#ddd';ctx.lineWidth=1;
  if(n===1){for(let y=20;y<h;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
  if(n===2){for(let x=0;x<w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
}
function wbTimer(){
  const el=$('#wb-timer');if(!el)return;
  el.style.display='block';
  let sec=120;
  clearInterval(window._wbt);
  window._wbt=setInterval(()=>{
    sec--;const m=Math.floor(sec/60),s=sec%60;
    el.textContent=m+':'+String(s).padStart(2,'0');
    if(sec<=0){clearInterval(window._wbt);el.textContent='0:00';speak('Süre doldu');toast('Süre doldu')}
  },1000);
  toast('Zamanlayıcı 2 dk');
}
let _wc='#111',_wd=false,_wx=0,_wy=0;
function setWc(c){_wc=c;if(window._wctx)window._wctx.strokeStyle=c}
function wClear(){const cv=$('#wcv');if(cv&&window._wctx)window._wctx.clearRect(0,0,cv.width,cv.height)}
(function(){
  document.addEventListener('pointerdown',e=>{
    const cv=$('#wcv');if(!cv||!$('#scr-wb')||!$('#scr-wb').classList.contains('on'))return;
    if(e.target.closest('.wtools'))return;
    if(!window._wctx){window._wctx=cv.getContext('2d');window._wctx.lineCap='round';window._wctx.lineWidth=3}
    window._wctx.strokeStyle=_wc;_wd=true;
    const r=cv.getBoundingClientRect();_wx=e.clientX-r.left;_wy=e.clientY-r.top;
  });
  document.addEventListener('pointermove',e=>{
    if(!_wd||!window._wctx)return;
    const cv=$('#wcv');if(!cv)return;
    const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
    window._wctx.beginPath();window._wctx.moveTo(_wx,_wy);window._wctx.lineTo(x,y);window._wctx.stroke();_wx=x;_wy=y;
  });
  document.addEventListener('pointerup',()=>{_wd=false});
})();

function openYT(){setMode('yt')}

function plugCable(){
  $('#cable').classList.add('plug');
  $('#desk-pc').classList.add('on');
  toast('Kablo takıldı…');
  speak('Kablo bağlandı',0.9);
  setTimeout(()=>{
    $('#pc-lock').classList.add('on');
    St.pcpin='';
    $('#pc-pin').textContent='____';
    toast('PC · PIN gir (1212)');
  },900);
}
function pcPin(n){if(St.pcpin.length>=4)return;St.pcpin+=''+n;$('#pc-pin').textContent=St.pcpin.replace(/./g,'•').padEnd(4,'_')}
function pcPinClr(){St.pcpin='';$('#pc-pin').textContent='____'}
function pcPinOk(){
  if(St.pcpin==='1212'){
    $('#pc-lock').classList.remove('on');
    if(St.installed){setMode('pc');powerBoard()}
    toast('Windows 11 açıldı');
    speak('Windows on bir hazır');
  }else{toast('Yanlış');pcPinClr()}
}

function toggleBag(){
  St.bagOpen=!St.bagOpen;
  $('#bag').classList.toggle('open',St.bagOpen);
  toast(St.bagOpen?'Torba açık · Kart ile tahtayı kapat/aç':'Torba kapalı');
}

function greet(){
  if(St.scared)return;
  [0,4,9,14,20].forEach((id,i)=>setTimeout(()=>{
    speakKid(id,'Merhaba öğretmenim');
  },i*500));
}
function speakKid(id,text){
  if(St.scared){toast('Korktular · Konuşamıyorlar');return}
  const el=document.querySelector(`.kid[data-id="${id}"]`);
  if(!el)return;
  el.classList.add('speak');
  let b=el.querySelector('.bubble');
  if(!b){b=document.createElement('div');b.className='bubble';el.appendChild(b)}
  b.textContent=text;
  speak(text,1.05);
  setTimeout(()=>{el.classList.remove('speak');if(b)b.remove()},2200);
}
function raiseHands(){
  document.querySelectorAll('.kid').forEach(k=>k.classList.remove('hand'));
  const ids=[];
  while(ids.length<6){const n=Math.floor(Math.random()*kids.length);if(!ids.includes(n))ids.push(n)}
  ids.forEach(id=>{const el=document.querySelector(`.kid[data-id="${id}"]`);if(el)el.classList.add('hand')});
  toast('Parmak kaldırdılar · Birine dokun');
  speak('Ben bitirdim öğretmenim');
}
function givePaper(grade){
  toast(grade+'. sınıf matematik dağıtıldı');
  speak(grade+'. sınıf kağıtları dağıtıyorum');
  setTimeout(()=>{
    raiseHands();
    toast('Bitirenler parmak kaldırdı');
  },2500);
}
function confiscate(){
  toast('Telefonlar alındı');
  speak('Telefonlarınızı verin',0.85);
}
function sendOut(){
  toast('Bazı öğrenciler dışarı çıktı');
  speak('Siz dışarı çıkın',0.85);
  document.querySelectorAll('.kid').forEach((k,i)=>{if(i%5===0)k.style.opacity='0.2'});
}
function yell(){
  St.scared=true;
  document.querySelectorAll('.kid').forEach(k=>k.classList.add('scared'));
  speak('Sessiz olun hemen yerinize oturun',0.75);
  toast('BAĞIRDI · Öğrenciler korktu, konuşamıyor');
  setTimeout(()=>{St.scared=false;document.querySelectorAll('.kid').forEach(k=>k.classList.remove('scared'))},8000);
}
function focusKid(id){
  const k=kids[id];if(!k)return;
  $('#zh').style.background=k.hair;
  $('#zn').textContent=k.name;
  $('#zl').textContent=St.scared?'… (korkuyor)':'Hazırım öğretmenim!';
  $('#zoom').classList.add('on');
  if(!St.scared)speak(k.name+' buradayım');
}
function closeZoom(){$('#zoom').classList.remove('on')}

function tickClock(){
  const t=()=>{const d=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});const c=$('#bw-clock');if(c)c.textContent=d;const p=$('#phc');if(p)p.textContent=d};
  t();setInterval(t,1000);
}
</script>
